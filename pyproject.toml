[project]
name = "model-committee"
version = "0.1.0"
description = "Fan-out/fan-in multi-model research committee: independent model agents research a question in parallel, a synthesizer maps agreement, disagreement and unique findings, and output skills package the result."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "markdown>=3.6",
    "mcp>=2.3.0",
]

[project.scripts]
committee = "model_committee.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_committee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real model CLIs/APIs (slow, costs credits); run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/model_committee/prompts.py" = ["E501"]  # prompt templates
